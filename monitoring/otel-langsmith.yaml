# Merge with otel-collector.yaml; credentials are injected only at runtime.
exporters:
  otlphttp/langsmith:
    endpoint: ${env:LANGSMITH_ENDPOINT}/otel
    headers:
      x-api-key: ${env:LANGSMITH_API_KEY}
      Langsmith-Project: ${env:LANGSMITH_PROJECT}
service:
  pipelines:
    traces:
      exporters: [otlp/jaeger, otlphttp/langsmith, debug]
