# Apply after compose.yaml and compose.gpu.yaml on a single 8 GiB NVIDIA GPU.
# CUDA 12.9 supports the driver used for the recorded Windows/WSL demo.
services:
  vllm:
    image: vllm/vllm-openai:v0.28.0-cu129
    shm_size: 1gb
    environment:
      # V1 avoids the V2 runner's UVA/pinned-memory requirement on Windows/WSL.
      VLLM_USE_V2_MODEL_RUNNER: "0"
      OTEL_SERVICE_NAME: lab28-vllm
    command:
      - --model
      - ${LAB28_VLLM_MODEL_ID:-Qwen/Qwen3-1.7B}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - half
      - --max-model-len
      - "4096"
      - --max-num-seqs
      - "2"
      - --max-num-batched-tokens
      - "1024"
      - --gpu-memory-utilization
      - "0.65"
      - --enforce-eager
      - --otlp-traces-endpoint
      - http://otel-collector:4317
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
