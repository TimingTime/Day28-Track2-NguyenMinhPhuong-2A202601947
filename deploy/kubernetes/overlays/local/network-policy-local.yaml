apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lab28-local-dependencies
  namespace: lab28
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lab28-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Recorded Docker Compose subnet. Check `docker network inspect` on another host.
    - to:
        - ipBlock:
            cidr: 172.22.0.0/16
      ports:
        - {protocol: TCP, port: 19092}
        - {protocol: TCP, port: 5000}
        - {protocol: TCP, port: 6333}
        - {protocol: TCP, port: 6566}
        - {protocol: TCP, port: 8000}
        - {protocol: TCP, port: 4317}
